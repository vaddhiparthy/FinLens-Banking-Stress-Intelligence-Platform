services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test:
      - CMD
      - pg_isready
      - -U
      - airflow
      interval: 10s
      retries: 5
  airflow-init:
    build:
      context: ..
      dockerfile: airflow/Dockerfile
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
      AIRFLOW__SCHEDULER__CREATE_CRON_DATA_INTERVALS: 'true'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    command:
    - bash
    - -c
    - 'set -euo pipefail

      airflow db migrate

      python -B -c ''import os,pathlib,shlex,shutil; p=pathlib.Path(shutil.which(''"''"''airflow''"''"''));
      argv=shlex.split(p.open().readline()[2:].strip()); assert len(argv)==1 and argv[0].startswith(''"''"''/''"''"'')
      and os.path.isfile(argv[0]); os.execv(argv[0],[argv[0],''"''"''-B''"''"'',''"''"''/opt/finlens-bootstrap-admin.py''"''"''])''

      '
    volumes:
    - type: bind
      source: /opt/apps/professional/finlens-airflow/bootstrap/bootstrap_admin.py
      target: /opt/finlens-bootstrap-admin.py
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /opt/apps/professional/finlens-airflow/bootstrap/secret
      target: /run/finlens-airflow-bootstrap
      read_only: true
      bind:
        create_host_path: false
  airflow-webserver:
    build:
      context: ..
      dockerfile: airflow/Dockerfile
    pull_policy: never
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
    - 8080:8080
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
      AIRFLOW__SCHEDULER__CREATE_CRON_DATA_INTERVALS: 'true'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__BASE_URL: http://localhost:8080
    command: api-server
    volumes:
    - ./dags:/opt/airflow/dags
    - ../dbt:/opt/finlens/dbt
    - ../src:/opt/finlens/src
    - ../ingestion:/opt/finlens/ingestion
  airflow-scheduler:
    build:
      context: ..
      dockerfile: airflow/Dockerfile
    pull_policy: never
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-webserver:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
      AIRFLOW__SCHEDULER__CREATE_CRON_DATA_INTERVALS: 'true'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    command: scheduler
    volumes:
    - ./dags:/opt/airflow/dags
    - ../dbt:/opt/finlens/dbt
    - ../src:/opt/finlens/src
    - ../ingestion:/opt/finlens/ingestion
  airflow-dag-processor:
    build:
      context: ..
      dockerfile: airflow/Dockerfile
    pull_policy: never
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-webserver:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
      AIRFLOW__SCHEDULER__CREATE_CRON_DATA_INTERVALS: 'true'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    command: dag-processor
    volumes:
    - ./dags:/opt/airflow/dags
