services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5

  airflow-init:
    build:
      context: ..
      dockerfile: airflow/Dockerfile
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
      AIRFLOW__SCHEDULER__CREATE_CRON_DATA_INTERVALS: "true"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        airflow db migrate
        if ! airflow users list --output json | python -c 'import json, sys; users=json.load(sys.stdin); raise SystemExit(0 if any(user.get("username") == "admin" for user in users) else 1)'; then
          airflow users create --username admin --password admin --firstname Fin --lastname Lens --role Admin --email admin@example.com
        fi

  airflow-webserver:
    build:
      context: ..
      dockerfile: airflow/Dockerfile
    pull_policy: never
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
      AIRFLOW__SCHEDULER__CREATE_CRON_DATA_INTERVALS: "true"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__BASE_URL: http://localhost:8080
    command: api-server
    volumes:
      - ./dags:/opt/airflow/dags
      - ../dbt:/opt/finlens/dbt
      - ../src:/opt/finlens/src
      - ../ingestion:/opt/finlens/ingestion

  airflow-scheduler:
    build:
      context: ..
      dockerfile: airflow/Dockerfile
    pull_policy: never
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-webserver:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
      AIRFLOW__SCHEDULER__CREATE_CRON_DATA_INTERVALS: "true"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    command: scheduler
    volumes:
      - ./dags:/opt/airflow/dags
      - ../dbt:/opt/finlens/dbt
      - ../src:/opt/finlens/src
      - ../ingestion:/opt/finlens/ingestion

  airflow-dag-processor:
    build:
      context: ..
      dockerfile: airflow/Dockerfile
    pull_policy: never
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-webserver:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
      AIRFLOW__SCHEDULER__CREATE_CRON_DATA_INTERVALS: "true"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    command: dag-processor
    volumes:
      - ./dags:/opt/airflow/dags
