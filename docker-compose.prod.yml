name: professional
services:
  finlens-web:
    image: sha256:2a39690bdc42c07bf772240abe574b1df87032b55d8d36ed5a52fe4d99c65e21
    pull_policy: never
    container_name: professional-finlens-web
    user: 10001:10001
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:rw,exec,nosuid,nodev,size=256m,mode=1777
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health',
        timeout=5)
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 1g
    memswap_limit: 1g
    cpus: '1.0'
    pids_limit: 512
    env_file:
    - /opt/platform/vault/secrets/professional/finlens-app.env
    environment:
      POSTGRES_SYNC_DSN: ${FINLENS_APP_DSN:?required}
      PORTFOLIO_PROFILE_URL: http://portfolio-qa-site:8088/data/site-content.json
      HOME: /tmp
    command:
    - streamlit
    - run
    - streamlit_app/app.py
    - --server.address=0.0.0.0
    - --server.port=8501
    - --server.headless=true
    - --server.enableCORS=true
    - --server.corsAllowedOrigins=https://vaddhiparthy.com
    - --server.enableXsrfProtection=true
    volumes:
    - ./data:/app/data
    - ./.duckdb:/app/.duckdb
    restart: 'no'
    expose:
    - '8501'
    networks:
    - professional_net
  finlens-public:
    image: sha256:dceedc7745309cc0adce6ed77948793c0c602afd8f3616ff0b1d7ab02e29b8db
    pull_policy: never
    container_name: professional-finlens-public
    user: 10001:10001
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:rw,exec,nosuid,nodev,size=256m,mode=1777
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/finlens/_stcore/health',
        timeout=5)
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 2g
    memswap_limit: 3g
    cpus: 1.0
    pids_limit: 512
    env_file:
    - /opt/platform/vault/secrets/professional/finlens-app.env
    environment:
      POSTGRES_SYNC_DSN: ${FINLENS_APP_DSN:?required}
      PORTFOLIO_PROFILE_URL: http://portfolio-qa-site:8088/data/site-content.json
      HOME: /tmp
    command:
    - streamlit
    - run
    - streamlit_app/app.py
    - --server.address=0.0.0.0
    - --server.port=8501
    - --server.headless=true
    - --server.enableCORS=true
    - --server.corsAllowedOrigins=https://vaddhiparthy.com
    - --server.enableXsrfProtection=true
    - --server.baseUrlPath=finlens
    volumes:
    - ./data:/app/data
    - ./.duckdb:/app/.duckdb
    restart: 'no'
    expose:
    - '8501'
    networks:
    - platform_edge
    - professional_net
  finlens-api:
    image: sha256:b4aaaad283226b0a45be793e6a082598f483f414d4937c03a192e4e41cba32e7
    pull_policy: never
    container_name: professional-finlens-api
    user: 10001:10001
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 512
    tmpfs:
    - /tmp:rw,exec,nosuid,nodev,size=64m,mode=1777
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',
        timeout=5)
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    memswap_limit: 512m
    cpus: '1.0'
    env_file:
    - /opt/platform/vault/secrets/professional/finlens-app.env
    environment:
      POSTGRES_SYNC_DSN: ${FINLENS_APP_DSN:?required}
    volumes:
    - ./data:/app/data
    - ./.duckdb:/app/.duckdb
    restart: 'no'
    expose:
    - '8000'
    networks:
    - platform_edge
    - professional_net
  finlens-db:
    image: sha256:75dcac3dfb1cd01ca3536910bbc84128759362f8b118bf8c55b38a94f68f3b73
    container_name: professional-finlens-db
    mem_limit: 512m
    memswap_limit: 512m
    cpus: '1.0'
    pids_limit: 512
    restart: 'no'
    read_only: true
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
    - /run:rw,nosuid,nodev,size=32m
    - /var/run/postgresql:rw,nosuid,nodev,size=32m,uid=70,gid=70,mode=0775
    environment:
      POSTGRES_USER: finlens
      POSTGRES_PASSWORD: ${FINLENS_DB_PASSWORD:?required}
      POSTGRES_DB: finlens
    volumes:
    - professional_finlens_control_db_pg18:/var/lib/postgresql
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U finlens -d finlens
      interval: 10s
      timeout: 5s
      retries: 5
    command:
    - postgres
    - -c
    - max_connections=25
    - -c
    - effective_cache_size=384MB
    expose:
    - '5432'
    networks:
    - professional_net
  airflow-db:
    image: sha256:75dcac3dfb1cd01ca3536910bbc84128759362f8b118bf8c55b38a94f68f3b73
    container_name: professional-finlens-airflow-db
    mem_limit: 512m
    memswap_limit: 512m
    cpus: '1.0'
    pids_limit: 512
    restart: 'no'
    read_only: true
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
    - /run:rw,nosuid,nodev,size=32m
    - /var/run/postgresql:rw,nosuid,nodev,size=32m,uid=70,gid=70,mode=0775
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?required}
      POSTGRES_DB: airflow
    volumes:
    - professional_finlens_airflow_db_pg18:/var/lib/postgresql
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U airflow -d airflow
      interval: 10s
      timeout: 5s
      retries: 5
    command:
    - postgres
    - -c
    - max_connections=30
    - -c
    - effective_cache_size=384MB
    expose:
    - '5432'
    networks:
    - professional_net
  airflow-init:
    image: sha256:d380286e94bb43ea25a8629d4f148d43fd7363a8013efcbc0255fc22d0017b36
    pull_policy: never
    container_name: professional-finlens-airflow-init
    group_add:
    - '10001'
    depends_on:
      airflow-db:
        condition: service_healthy
      finlens-db:
        condition: service_healthy
    env_file:
    - /opt/platform/vault/secrets/professional/finlens-app.env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://professional-finlens-airflow-web:8080/execution/
      AIRFLOW__SCHEDULER__CREATE_CRON_DATA_INTERVALS: 'true'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_APP_SQL_DSN:?required}
      POSTGRES_SYNC_DSN: ${FINLENS_APP_DSN:?required}
      FINLENS_DUCKDB_PATH: /opt/finlens/.duckdb/finlens.duckdb
    volumes:
    - ./data:/opt/finlens/data
    - ./.duckdb:/opt/finlens/.duckdb
    - ./airflow/dags:/opt/airflow/dags
    - ./scripts/retain_control_plane_postgres.py:/opt/finlens/scripts/retain_control_plane_postgres.py:ro
    - airflow_logs:/opt/airflow/logs
    - type: bind
      source: /opt/apps/professional/finlens-airflow/bootstrap/bootstrap_admin.py
      target: /opt/finlens-bootstrap-admin.py
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /opt/apps/professional/finlens-airflow/bootstrap/secret
      target: /run/finlens-airflow-bootstrap
      read_only: true
      bind:
        create_host_path: false
    command:
    - bash
    - -c
    - 'set -euo pipefail

      airflow db migrate

      python -B -c ''import os,pathlib,shlex,shutil; p=pathlib.Path(shutil.which(''"''"''airflow''"''"''));
      argv=shlex.split(p.open().readline()[2:].strip()); assert len(argv)==1 and argv[0].startswith(''"''"''/''"''"'')
      and os.path.isfile(argv[0]); os.execv(argv[0],[argv[0],''"''"''-B''"''"'',''"''"''/opt/finlens-bootstrap-admin.py''"''"''])''

      '
    networks:
    - professional_net
  airflow-web:
    image: sha256:45bccbd25b1492651d262d8893c548e6b14184b33fde0b53b6527a5e5cb96a13
    pull_policy: never
    container_name: professional-finlens-airflow-web
    group_add:
    - '10001'
    healthcheck:
      test:
      - CMD-SHELL
      - python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/api/v2/monitor/health",
        timeout=8).read()'
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 2g
    memswap_limit: 2g
    cpus: '2.0'
    pids_limit: 1024
    restart: 'no'
    read_only: true
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=256m
    - /var/tmp:rw,noexec,nosuid,nodev,size=64m
    - /run:rw,nosuid,nodev,size=32m
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
    - /opt/platform/vault/secrets/professional/finlens-app.env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://professional-finlens-airflow-web:8080/execution/
      AIRFLOW__SCHEDULER__CREATE_CRON_DATA_INTERVALS: 'true'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_APP_SQL_DSN:?required}
      POSTGRES_SYNC_DSN: ${FINLENS_APP_DSN:?required}
      FINLENS_DUCKDB_PATH: /opt/finlens/.duckdb/finlens.duckdb
      AIRFLOW__API__BASE_URL: https://airflow.vaddhiparthy.vip
      AIRFLOW__FAB__CONFIG_FILE: /opt/airflow/webserver_config.py
      AIRFLOW__FAB__ENABLE_PROXY_FIX: 'true'
      AIRFLOW__FAB__UPDATE_FAB_PERMS: 'True'
    command: api-server
    volumes:
    - ./data:/opt/finlens/data
    - ./.duckdb:/opt/finlens/.duckdb
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/webserver_config.py:/opt/airflow/webserver_config.py:ro
    - ./scripts/retain_control_plane_postgres.py:/opt/finlens/scripts/retain_control_plane_postgres.py:ro
    - airflow_logs:/opt/airflow/logs
    expose:
    - '8080'
    networks:
    - professional_net
    - platform_edge
  scheduler:
    image: sha256:869a5061d93810e61fbd16b571b132602e1cbf15dbfdfe963af0fa95c8293167
    pull_policy: never
    container_name: professional-finlens-scheduler
    group_add:
    - '10001'
    healthcheck:
      test:
      - CMD-SHELL
      - python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8974/health", timeout=8).read()'
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 10s
    mem_limit: 1.5g
    memswap_limit: 1.5g
    cpus: '2.0'
    pids_limit: 1024
    restart: 'no'
    read_only: true
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=256m
    - /var/tmp:rw,noexec,nosuid,nodev,size=64m
    - /run:rw,nosuid,nodev,size=32m
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-web:
        condition: service_healthy
    env_file:
    - /opt/platform/vault/secrets/professional/finlens-app.env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://professional-finlens-airflow-web:8080/execution/
      AIRFLOW__SCHEDULER__CREATE_CRON_DATA_INTERVALS: 'true'
      AIRFLOW__CORE__PARALLELISM: '8'
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'True'
      AIRFLOW__SCHEDULER__SCHEDULER_HEALTH_CHECK_SERVER_HOST: '127.0.0.1'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_APP_SQL_DSN:?required}
      AIRFLOW_METADATA_DSN: ${AIRFLOW_APP_METADATA_DSN:?required}
      POSTGRES_SYNC_DSN: ${FINLENS_APP_DSN:?required}
      FINLENS_DUCKDB_PATH: /opt/finlens/.duckdb/finlens.duckdb
      AIRFLOW__FAB__UPDATE_FAB_PERMS: 'True'
    command: scheduler
    volumes:
    - /opt/apps/professional/projects/finlens/.dbt-runtime/scheduler/logs:/opt/finlens/dbt/logs
    - /opt/apps/professional/projects/finlens/.dbt-runtime/scheduler/target:/opt/finlens/dbt/target
    - ./data:/opt/finlens/data
    - ./.duckdb:/opt/finlens/.duckdb
    - ./airflow/dags:/opt/airflow/dags
    - ./scripts/sync_control_plane_to_postgres.py:/opt/finlens/scripts/sync_control_plane_to_postgres.py:ro
    - ./scripts/collect_airflow_evidence.py:/opt/finlens/scripts/collect_airflow_evidence.py:ro
    - ./scripts/retain_control_plane_postgres.py:/opt/finlens/scripts/retain_control_plane_postgres.py:ro
    - airflow_logs:/opt/airflow/logs
    networks:
    - professional_net
  dag-processor:
    image: sha256:869a5061d93810e61fbd16b571b132602e1cbf15dbfdfe963af0fa95c8293167
    pull_policy: never
    container_name: professional-finlens-dag-processor
    healthcheck:
      test:
      - CMD-SHELL
      - airflow jobs check --job-type DagProcessorJob --local >/dev/null 2>&1 || exit
        1
      interval: 180s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 10s
    mem_limit: 768m
    memswap_limit: 768m
    cpus: '2.0'
    pids_limit: 1024
    restart: 'no'
    read_only: true
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=256m
    - /var/tmp:rw,noexec,nosuid,nodev,size=64m
    - /run:rw,nosuid,nodev,size=32m
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-web:
        condition: service_healthy
    env_file:
    - /opt/platform/vault/secrets/professional/finlens-app.env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://professional-finlens-airflow-web:8080/execution/
      AIRFLOW__SCHEDULER__CREATE_CRON_DATA_INTERVALS: 'true'
      AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: '300'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_APP_SQL_DSN:?required}
      POSTGRES_SYNC_DSN: ${FINLENS_APP_DSN:?required}
      FINLENS_DUCKDB_PATH: /opt/finlens/.duckdb/finlens.duckdb
      AIRFLOW__FAB__UPDATE_FAB_PERMS: 'True'
    command: dag-processor
    volumes:
    - /opt/apps/professional/projects/finlens/.dbt-runtime/dag-processor/logs:/opt/finlens/dbt/logs
    - /opt/apps/professional/projects/finlens/.dbt-runtime/dag-processor/target:/opt/finlens/dbt/target
    - ./airflow/dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs
    - /opt/apps/professional/projects/finlens/data/state:/opt/finlens/data/state:rw
    networks:
    - professional_net
    group_add:
    - '10001'
volumes:
  airflow_logs: null
  professional_finlens_control_db:
    external: true
  professional_finlens_control_db_pg18:
    external: true
  professional_finlens_airflow_db:
    external: true
  professional_finlens_airflow_db_pg18:
    external: true
networks:
  platform_edge:
    external: true
  professional_net:
    external: true
