name: professional
services:
  finlens-web:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    pull_policy: never
    container_name: professional-finlens-web
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 1g
    memswap_limit: 1g
    env_file:
      - /opt/platform/vault/secrets/professional/finlens.env
    environment:
      POSTGRES_SYNC_DSN: postgresql://finlens:finlens@professional-finlens-db:5432/finlens
    volumes:
      - ./data:/app/data
      - ./.duckdb:/app/.duckdb
    restart: unless-stopped
    expose:
      - "8501"
    networks:
      - professional_net

  finlens-public:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    pull_policy: never
    container_name: professional-finlens-public
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/finlens/_stcore/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 2g
    memswap_limit: 2g
    env_file:
      - /opt/platform/vault/secrets/professional/finlens.env
    environment:
      POSTGRES_SYNC_DSN: postgresql://finlens:finlens@professional-finlens-db:5432/finlens
    command:
      - streamlit
      - run
      - streamlit_app/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --server.enableCORS=false
      - --server.enableXsrfProtection=true
      - --server.baseUrlPath=finlens
    volumes:
      - ./data:/app/data
      - ./.duckdb:/app/.duckdb
    restart: unless-stopped
    expose:
      - "8501"
    networks:
      - platform_edge
      - professional_net

  finlens-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    pull_policy: never
    container_name: professional-finlens-api
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    memswap_limit: 512m
    env_file:
      - /opt/platform/vault/secrets/professional/finlens.env
    environment:
      POSTGRES_SYNC_DSN: postgresql://finlens:finlens@professional-finlens-db:5432/finlens
    volumes:
      - ./data:/app/data
      - ./.duckdb:/app/.duckdb
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - platform_edge
      - professional_net

  finlens-db:
    image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685  # PostgreSQL 16.15-alpine3.24, pinned 2026-08-23
    container_name: professional-finlens-db
    mem_limit: 512m
    memswap_limit: 512m
    restart: unless-stopped
    environment:
      POSTGRES_USER: finlens
      POSTGRES_PASSWORD: finlens
      POSTGRES_DB: finlens
    volumes:
      - professional_finlens_control_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finlens -d finlens"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: ["postgres", "-c", "max_connections=25", "-c", "effective_cache_size=384MB"]
    expose:
      - "5432"
    networks:
      - professional_net

  airflow-db:
    image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685  # PostgreSQL 16.15-alpine3.24, pinned 2026-08-23
    container_name: professional-finlens-airflow-db
    mem_limit: 512m
    memswap_limit: 512m
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - professional_finlens_airflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: ["postgres", "-c", "max_connections=30", "-c", "effective_cache_size=384MB"]
    expose:
      - "5432"
    networks:
      - professional_net

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    pull_policy: never
    container_name: professional-finlens-airflow-init
    depends_on:
      airflow-db:
        condition: service_healthy
      finlens-db:
        condition: service_healthy
    env_file:
      - /opt/platform/vault/secrets/professional/finlens.env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://professional-finlens-airflow-web:8080/execution/
      AIRFLOW__SCHEDULER__CREATE_CRON_DATA_INTERVALS: "true"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@professional-finlens-airflow-db:5432/airflow
      POSTGRES_SYNC_DSN: postgresql://finlens:finlens@professional-finlens-db:5432/finlens
      FINLENS_DUCKDB_PATH: /opt/finlens/.duckdb/finlens.duckdb
    volumes:
      - ./data:/opt/finlens/data
      - ./.duckdb:/opt/finlens/.duckdb
      - ./airflow/dags:/opt/airflow/dags
      - ./scripts/retain_control_plane_postgres.py:/opt/finlens/scripts/retain_control_plane_postgres.py:ro
      - airflow_logs:/opt/airflow/logs
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        airflow db migrate
        if ! airflow users list --output json | python -c 'import json, sys; users=json.load(sys.stdin); raise SystemExit(0 if any(user.get("username") == "admin" for user in users) else 1)'; then
          airflow users create --username admin --password admin --firstname Fin --lastname Lens --role Admin --email admin@example.com
        fi
    networks:
      - professional_net

  airflow-web:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    pull_policy: never
    container_name: professional-finlens-airflow-web
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8080/api/v2/monitor/health\", timeout=8).read()'"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 2g
    memswap_limit: 2g
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - /opt/platform/vault/secrets/professional/finlens.env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://professional-finlens-airflow-web:8080/execution/
      AIRFLOW__SCHEDULER__CREATE_CRON_DATA_INTERVALS: "true"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@professional-finlens-airflow-db:5432/airflow
      POSTGRES_SYNC_DSN: postgresql://finlens:finlens@professional-finlens-db:5432/finlens
      FINLENS_DUCKDB_PATH: /opt/finlens/.duckdb/finlens.duckdb
      AIRFLOW__API__BASE_URL: https://airflow.vaddhiparthy.vip
      AIRFLOW__FAB__CONFIG_FILE: /opt/airflow/webserver_config.py
      AIRFLOW__FAB__ENABLE_PROXY_FIX: "true"
      AIRFLOW__FAB__UPDATE_FAB_PERMS: "True"
    command: api-server
    volumes:
      - ./data:/opt/finlens/data
      - ./.duckdb:/opt/finlens/.duckdb
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/webserver_config.py:/opt/airflow/webserver_config.py:ro
      - ./scripts/retain_control_plane_postgres.py:/opt/finlens/scripts/retain_control_plane_postgres.py:ro
      - airflow_logs:/opt/airflow/logs
    expose:
      - "8080"
    networks:
      - professional_net
      - platform_edge

  scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    pull_policy: never
    container_name: professional-finlens-scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 1.5g
    memswap_limit: 1.5g
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-web:
        condition: service_healthy
    env_file:
      - /opt/platform/vault/secrets/professional/finlens.env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://professional-finlens-airflow-web:8080/execution/
      AIRFLOW__SCHEDULER__CREATE_CRON_DATA_INTERVALS: "true"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@professional-finlens-airflow-db:5432/airflow
      AIRFLOW_METADATA_DSN: postgresql://airflow:airflow@professional-finlens-airflow-db:5432/airflow
      POSTGRES_SYNC_DSN: postgresql://finlens:finlens@professional-finlens-db:5432/finlens
      FINLENS_DUCKDB_PATH: /opt/finlens/.duckdb/finlens.duckdb
      AIRFLOW__FAB__UPDATE_FAB_PERMS: "True"
    command: scheduler
    volumes:
      - ./data:/opt/finlens/data
      - ./.duckdb:/opt/finlens/.duckdb
      - ./airflow/dags:/opt/airflow/dags
      - ./scripts/collect_airflow_evidence.py:/opt/finlens/scripts/collect_airflow_evidence.py:ro
      - ./scripts/retain_control_plane_postgres.py:/opt/finlens/scripts/retain_control_plane_postgres.py:ro
      - airflow_logs:/opt/airflow/logs
    networks:
      - professional_net

  dag-processor:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    pull_policy: never
    container_name: professional-finlens-dag-processor
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --local >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 768m
    memswap_limit: 768m
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-web:
        condition: service_healthy
    env_file:
      - /opt/platform/vault/secrets/professional/finlens.env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://professional-finlens-airflow-web:8080/execution/
      AIRFLOW__SCHEDULER__CREATE_CRON_DATA_INTERVALS: "true"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@professional-finlens-airflow-db:5432/airflow
      POSTGRES_SYNC_DSN: postgresql://finlens:finlens@professional-finlens-db:5432/finlens
      FINLENS_DUCKDB_PATH: /opt/finlens/.duckdb/finlens.duckdb
      AIRFLOW__FAB__UPDATE_FAB_PERMS: "True"
    command: dag-processor
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    networks:
      - professional_net

volumes:
  airflow_logs:
  professional_finlens_control_db:
    external: true
  professional_finlens_airflow_db:
    external: true
networks:
  platform_edge:
    external: true
  professional_net:
    external: true

